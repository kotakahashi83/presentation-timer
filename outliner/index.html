<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>アウトライナー</title>
<style>
  :root{
    --bg:#f6f6f3;
    --panel:#ffffff;
    --fg:#1e1e1c;
    --fg-muted:#7b7b74;
    --border:#e3e3de;
    --accent:#2f7de1;
    --accent-soft:rgba(47,125,225,0.12);
    --danger:#d8412f;
    --shadow:0 10px 30px rgba(0,0,0,0.14);

    --top-h:52px;
    --indent:24px;
    --row-h:40px;
    --handle-w:28px;
    --bullet-w:26px;
    --toolbar-h:56px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141517;
      --panel:#1c1e21;
      --fg:#ececea;
      --fg-muted:#8f8f89;
      --border:#2c2f34;
      --accent:#5b9cf0;
      --accent-soft:rgba(91,156,240,0.18);
      --danger:#f0705f;
      --shadow:0 10px 30px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141517;
    --panel:#1c1e21;
    --fg:#ececea;
    --fg-muted:#8f8f89;
    --border:#2c2f34;
    --accent:#5b9cf0;
    --accent-soft:rgba(91,156,240,0.18);
    --danger:#f0705f;
    --shadow:0 10px 30px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---- top bar ---- */
  #topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:6px;
    height:var(--top-h);padding:0 10px;
    background:var(--panel);border-bottom:1px solid var(--border);
  }
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border:0;border-radius:10px;background:transparent;cursor:pointer;
    color:var(--fg);
  }
  .icon-btn:hover{background:var(--accent-soft);}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  #menuBtn{display:none;}
  #projectTitle{
    flex:1;min-width:0;margin:0;
    font-size:17px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #syncDot{
    width:8px;height:8px;border-radius:50%;flex:none;margin:0 6px;
    background:var(--fg-muted);opacity:.6;
  }
  #syncDot[data-sync="synced"]{background:#2fa36b;opacity:1;}
  #syncDot[data-sync="syncing"]{background:var(--accent);opacity:1;animation:sync-pulse 1s ease-in-out infinite;}
  #syncDot[data-sync="error"]{background:var(--danger);opacity:1;}
  @keyframes sync-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  #moreMenu{position:relative;}
  #moreMenu summary{list-style:none;cursor:pointer;}
  #moreMenu summary::-webkit-details-marker{display:none;}
  #moreMenu summary::marker{content:"";}
  .menu-panel{
    position:absolute;right:0;top:48px;min-width:220px;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);padding:6px;z-index:40;
  }
  .menu-panel button{
    display:block;width:100%;text-align:left;
    padding:10px 12px;border:0;border-radius:8px;background:transparent;cursor:pointer;
  }
  .menu-panel button:hover{background:var(--accent-soft);}

  /* ---- layout ---- */
  .app{display:grid;grid-template-columns:240px minmax(0,1fr);}
  #sidebar{
    position:sticky;top:var(--top-h);
    height:calc(100vh - var(--top-h));
    display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--border);
    overflow:auto;
  }
  .sidebar-head{
    padding:14px 14px 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--fg-muted);
  }
  #projectList{list-style:none;margin:0;padding:0 8px;}
  .project{display:flex;align-items:center;border-radius:8px;}
  .project.active{background:var(--accent-soft);}
  .project .pname{
    flex:1;min-width:0;text-align:left;
    padding:10px 10px;border:0;background:transparent;cursor:pointer;border-radius:8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .project .pedit,.project .pdel{
    width:32px;height:36px;border:0;background:transparent;cursor:pointer;border-radius:8px;
    color:var(--fg-muted);opacity:0;flex:none;
  }
  .project:hover .pedit,.project:hover .pdel,.project.active .pedit,.project.active .pdel{opacity:1;}
  .project .pdel:hover{color:var(--danger);}
  .project .prename{
    flex:1;min-width:0;margin:4px;padding:8px;font:inherit;
    border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:inherit;
  }
  #addProject{
    margin:8px;padding:10px 12px;text-align:left;
    border:1px dashed var(--border);border-radius:8px;background:transparent;cursor:pointer;color:var(--fg-muted);
  }
  #addProject:hover{color:var(--fg);border-color:var(--accent);}
  .sidebar-foot{margin-top:auto;padding:12px 14px;font-size:12px;color:var(--fg-muted);}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:39;display:none;}
  #backdrop.open{display:block;}

  #main{position:relative;padding:14px 14px 120px;}
  #list{max-width:840px;}

  /* ---- rows ---- */
  .item{
    display:flex;align-items:flex-start;
    padding-left:calc(var(--d,0) * var(--indent));
    border-radius:8px;
  }
  .item.dragging{opacity:.35;}
  .handle{
    flex:none;width:var(--handle-w);height:var(--row-h);
    display:flex;align-items:center;justify-content:center;
    border:0;padding:0;background:transparent;color:var(--fg-muted);
    cursor:grab;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    opacity:.35;
  }
  .handle svg{width:14px;height:18px;fill:currentColor;}
  .item:hover .handle,.item:focus-within .handle{opacity:.85;}
  .bullet{
    flex:none;width:var(--bullet-w);height:var(--row-h);
    display:flex;align-items:center;justify-content:center;
    border:0;padding:0;background:transparent;cursor:pointer;color:var(--fg);border-radius:50%;
  }
  .bullet::before{
    content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
    box-shadow:0 0 0 0 transparent;transition:box-shadow .15s;
  }
  .item.has-children .bullet::before{box-shadow:0 0 0 4px var(--border);}
  .item.collapsed .bullet::before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .bullet:hover::before{box-shadow:0 0 0 5px var(--accent-soft);}
  .item textarea{
    flex:1;min-width:0;display:block;
    margin:0;padding:8px 6px;border:0;border-radius:6px;
    font:inherit;font-size:16px;line-height:24px;
    background:transparent;color:inherit;
    resize:none;overflow:hidden;outline:none;
    white-space:pre-wrap;overflow-wrap:anywhere;
    field-sizing:content;
  }
  .item textarea:focus{background:var(--accent-soft);}
  .item textarea::placeholder{color:var(--fg-muted);opacity:.6;}
  #addItem{
    margin:6px 0 0 calc(var(--handle-w) + var(--bullet-w));
    padding:8px 6px;border:0;background:transparent;cursor:pointer;color:var(--fg-muted);
  }
  #addItem:hover{color:var(--accent);}

  #dropIndicator{
    position:absolute;height:3px;right:14px;border-radius:2px;
    background:var(--accent);pointer-events:none;z-index:5;
  }
  #dropIndicator::before{
    content:"";position:absolute;left:-6px;top:-4px;width:11px;height:11px;border-radius:50%;
    background:var(--accent);
  }
  #ghost{
    position:fixed;left:0;top:0;z-index:60;pointer-events:none;
    max-width:60vw;padding:8px 12px;border-radius:8px;
    background:var(--panel);color:var(--fg);border:1px solid var(--border);box-shadow:var(--shadow);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing;}
  body.is-dragging .handle{cursor:grabbing;}

  /* ---- bottom toolbar (touch / narrow) ---- */
  #toolbar{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    display:none;gap:2px;
    padding:4px 6px calc(4px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--border);
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  #toolbar button{
    flex:1;min-width:40px;min-height:44px;
    border:0;border-radius:10px;background:transparent;cursor:pointer;color:var(--fg);
    display:flex;align-items:center;justify-content:center;
  }
  #toolbar button:disabled{opacity:.3;}
  #toolbar button svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  #toolbar button.danger{color:var(--danger);}

  #toast{
    position:fixed;left:50%;bottom:calc(var(--toolbar-h) + 24px);transform:translate(-50%,10px);
    padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:720px){
    :root{--indent:18px;}
    .app{grid-template-columns:minmax(0,1fr);}
    #menuBtn{display:inline-flex;}
    #sidebar{
      position:fixed;top:0;bottom:0;left:0;height:auto;
      width:min(82vw,320px);z-index:40;
      transform:translateX(-100%);transition:transform .2s ease;
    }
    #sidebar.open{transform:none;box-shadow:var(--shadow);}
    .project .pedit,.project .pdel{opacity:1;}
    #main{padding:10px 10px calc(var(--toolbar-h) + 140px);}
    #dropIndicator{right:10px;}
    #toolbar{display:flex;}
  }
  @media (pointer:coarse){
    #toolbar{display:flex;}
    #main{padding-bottom:calc(var(--toolbar-h) + 140px);}
    .handle{opacity:.6;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>

<header id="topbar">
  <button id="menuBtn" class="icon-btn" type="button" aria-label="プロジェクト一覧を開く" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <h1 id="projectTitle">アウトライナー</h1>
  <span id="syncDot" hidden title=""></span>
  <details id="moreMenu">
    <summary class="icon-btn" aria-label="メニュー">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
    </summary>
    <div class="menu-panel">
      <button id="btnCopy" type="button">テキストとしてコピー</button>
      <button id="btnExport" type="button">JSON を書き出し</button>
      <button id="btnImport" type="button">JSON を読み込み</button>
    </div>
  </details>
</header>

<div class="app">
  <aside id="sidebar" aria-label="プロジェクト">
    <div class="sidebar-head">プロジェクト</div>
    <ul id="projectList"></ul>
    <button id="addProject" type="button">＋ 新規プロジェクト</button>
    <div class="sidebar-foot" id="syncNote">データはこの端末のブラウザに保存されます。</div>
  </aside>
  <div id="backdrop"></div>
  <main id="main">
    <div id="list" role="tree" aria-label="アウトライン"></div>
    <button id="addItem" type="button">＋ 項目を追加</button>
    <div id="dropIndicator" hidden></div>
  </main>
</div>

<div id="toolbar" role="toolbar" aria-label="項目の操作">
  <button type="button" data-cmd="outdent" aria-label="一階層上げる" title="一階層上げる (Shift+Tab)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6h9M11 12h9M11 18h9M8 9l-4 3 4 3"/></svg>
  </button>
  <button type="button" data-cmd="indent" aria-label="一階層下げる" title="一階層下げる (Tab)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6h9M11 12h9M11 18h9M4 9l4 3-4 3"/></svg>
  </button>
  <button type="button" data-cmd="moveUp" aria-label="上へ移動" title="上へ移動 (Alt+↑)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <button type="button" data-cmd="moveDown" aria-label="下へ移動" title="下へ移動 (Alt+↓)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
  </button>
  <button type="button" data-cmd="toggle" aria-label="折りたたみ / 展開" title="折りたたみ / 展開 (Ctrl+.)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <button type="button" data-cmd="add" aria-label="項目を追加" title="項目を追加 (Enter)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button type="button" class="danger" data-cmd="delete" aria-label="項目を削除" title="項目を削除">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>
  </button>
</div>

<div id="ghost" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
  'use strict';

  /* ========== A. constants & helpers ========== */
  const MAX_DEPTH = 4;
  const STORAGE_KEY = 'outliner.v1';
  const $ = (sel, root) => (root || document).querySelector(sel);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  function debounce(fn, ms){
    let t = null;
    const d = function(){ clearTimeout(t); t = setTimeout(() => { t = null; fn(); }, ms); };
    d.flush = function(){ if (t) { clearTimeout(t); t = null; fn(); } };
    return d;
  }
  const supportsFieldSizing = !!(window.CSS && CSS.supports && CSS.supports('field-sizing', 'content'));

  const listEl = $('#list');
  const mainEl = $('#main');
  const indicator = $('#dropIndicator');
  const ghost = $('#ghost');
  const toolbar = $('#toolbar');
  const sidebar = $('#sidebar');
  const backdrop = $('#backdrop');
  const menuBtn = $('#menuBtn');
  const moreMenu = $('#moreMenu');
  const importFile = $('#importFile');
  const toastEl = $('#toast');

  /* ========== B. state ========== */
  function makeItem(text, depth){ return { id: uid(), text: text || '', depth: depth || 0, collapsed: false }; }

  function DEFAULT_STATE(){
    const rows = [
      ['はじめてのプロジェクトへようこそ', 0],
      ['Enter で新しい項目を作ります', 1],
      ['Tab で一段下げ、Shift + Tab で一段上げ（最大 5 階層）', 1],
      ['Alt + ↑ / ↓ で項目を上下に移動できます', 1],
      ['左の ⋮⋮ をドラッグすると並べ替えられます（横にずらすと階層も変わります）', 1],
      ['● をクリック / タップすると子項目を折りたたみます', 1],
      ['折りたたまれた項目の例（● を押して展開）', 2],
      ['ここは隠れていました', 3],
      ['さらに深い階層', 4],
      ['スマホでは画面下のボタンで階層の上げ下げや移動ができます', 1],
      ['プロジェクトは左のメニュー（スマホは ☰）から追加・切替できます', 1],
      ['データはこの端末のブラウザに保存されます。右上の ⋯ から書き出し・読み込みができます', 1]
    ];
    const items = rows.map(r => makeItem(r[0], r[1]));
    items[6].collapsed = true;
    const p = { id: 'welcome', name: 'はじめてのプロジェクト', items: items, createdAt: Date.now(), synced: false };
    return { version: 1, activeProjectId: p.id, projects: [p] };
  }

  function normalizeProjects(list, seen){
    seen = seen || new Set();
    const fixId = (o) => { if (typeof o.id !== 'string' || !o.id || seen.has(o.id)) o.id = uid(); seen.add(o.id); };
    if (!Array.isArray(list)) return [];
    const base = Date.now();
    return list.filter(p => p && typeof p === 'object').map((p, index) => {
      fixId(p);
      const createdAt = Number.isFinite(p.createdAt) ? p.createdAt : base + index;
      const name = (typeof p.name === 'string' && p.name.trim()) ? p.name.trim() : '無題のプロジェクト';
      let prevDepth = -1;
      let items = (Array.isArray(p.items) ? p.items : []).filter(it => it && typeof it === 'object').map(it => {
        fixId(it);
        const text = typeof it.text === 'string' ? it.text.replace(/\r?\n/g, ' ') : '';
        let depth = Number.isInteger(it.depth) ? it.depth : 0;
        depth = clamp(depth, 0, Math.min(MAX_DEPTH, prevDepth + 1));
        prevDepth = depth;
        return { id: it.id, text: text, depth: depth, collapsed: !!it.collapsed };
      });
      if (!items.length) items.push(makeItem());
      return { id: p.id, name: name, items: items, createdAt: createdAt, synced: !!p.synced };
    });
  }

  function normalize(raw){
    const st = (raw && typeof raw === 'object') ? raw : {};
    const projects = normalizeProjects(st.projects);
    if (!projects.length) return DEFAULT_STATE();
    const active = projects.some(p => p.id === st.activeProjectId) ? st.activeProjectId : projects[0].id;
    return { version: 1, activeProjectId: active, projects: projects };
  }

  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return DEFAULT_STATE();
      return normalize(JSON.parse(raw));
    } catch (e) { return DEFAULT_STATE(); }
  }
  function saveNow(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  const saveSoon = debounce(saveNow, 300);
  function newProject(name){ return { id: uid(), name: name, items: [makeItem()], createdAt: Date.now(), synced: false }; }

  let state = load();
  let activeId = null;
  const rowsById = new Map();

  function project(){
    let p = state.projects.find(p => p.id === state.activeProjectId);
    if (!p) { p = state.projects[0]; state.activeProjectId = p.id; }
    return p;
  }
  function items(){ return project().items; }
  function idxOf(id){ return items().findIndex(it => it.id === id); }

  /* ========== C. pure tree operations on items[] ========== */
  function subtreeEnd(its, i){ const d = its[i].depth; let j = i + 1; while (j < its.length && its[j].depth > d) j++; return j; }
  function hasChildren(its, i){ return i + 1 < its.length && its[i + 1].depth > its[i].depth; }
  function subtreeHeight(its, i){ const d = its[i].depth; let m = d; for (let j = i + 1; j < its.length && its[j].depth > d; j++) m = Math.max(m, its[j].depth); return m - d; }
  function prevSibling(its, i){ const d = its[i].depth; for (let j = i - 1; j >= 0; j--) { if (its[j].depth < d) return -1; if (its[j].depth === d) return j; } return -1; }
  function nextSibling(its, i){ const e = subtreeEnd(its, i); return (e < its.length && its[e].depth === its[i].depth) ? e : -1; }
  function isVisible(its, i){
    let cur = its[i].depth;
    for (let j = i - 1; j >= 0 && cur > 0; j--) {
      if (its[j].depth < cur) { if (its[j].collapsed) return false; cur = its[j].depth; }
    }
    return true;
  }
  function visibleIndices(its){
    const out = []; let hideBelow = Infinity;
    for (let i = 0; i < its.length; i++) {
      const it = its[i];
      if (it.depth > hideBelow) continue;
      hideBelow = Infinity;
      out.push(i);
      if (it.collapsed && hasChildren(its, i)) hideBelow = it.depth;
    }
    return out;
  }
  function prevVisible(its, i){ for (let j = i - 1; j >= 0; j--) if (isVisible(its, j)) return j; return -1; }
  function nextVisible(its, i){ for (let j = i + 1; j < its.length; j++) if (isVisible(its, j)) return j; return -1; }
  function revealAncestors(its, i){
    let cur = its[i].depth;
    for (let j = i - 1; j >= 0 && cur > 0; j--) {
      if (its[j].depth < cur) { its[j].collapsed = false; cur = its[j].depth; }
    }
  }
  function canIndent(its, i){ return i > 0 && its[i].depth <= its[i - 1].depth && its[i].depth + subtreeHeight(its, i) + 1 <= MAX_DEPTH; }
  function indent(its, i){ const e = subtreeEnd(its, i); for (let j = i; j < e; j++) its[j].depth++; revealAncestors(its, i); }
  function canOutdent(its, i){ return its[i].depth > 0; }
  function outdent(its, i){ const e = subtreeEnd(its, i); for (let j = i; j < e; j++) its[j].depth--; }

  function splitItem(its, i, selStart, selEnd){
    const it = its[i];
    if (selStart === 0 && selEnd === 0 && it.text !== '') {
      its.splice(i, 0, makeItem('', it.depth));
      return { focus: i + 1, caret: 0 };
    }

  /* ========== G. keyboard ========== */

  function addProject(){

  function deleteProject(id){

    state.projects = state.projects.filter(q => q.id !== id);
    let replacement = null;
    if (!state.projects.length) { replacement = newProject('新しいプロジェクト'); state.projects.push(replacement); }
    if (state.activeProjectId === id) { state.activeProjectId = state.projects[0].id; activeId = null; }

  function startRename(id){

      if (pendingSnap) { const s = pendingSnap; pendingSnap = null; applySnapshot(s); }

      if (e.isComposing || e.keyCode === 229) return;

  $('#projectList').addEventListener('click', (e) => {
    const li = e.target.closest('li.project'); if (!li) return;

    const li = e.target.closest('li.project');
    if (li && e.target.closest('.pname')) startRename(li.dataset.id);
  });
  $('#addProject').addEventListener('click', addProject);

  /* ========== J. export / import / copy ========== */
  let toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }
  function closeMenu(){ moreMenu.open = false; }
  document.addEventListener('click', (e) => { if (moreMenu.open && !moreMenu.contains(e.target)) moreMenu.open = false; });

  function dateStamp(){ const d = new Date(); const z = n => String(n).padStart(2, '0'); return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()); }
  $('#btnExport').addEventListener('click', async () => {
    closeMenu();
    saveSoon.flush();
    const filename = 'outliner-' + dateStamp() + '.json';
    const json = JSON.stringify(state, null, 2);
    // claude.ai の Artifact 内では downloads 機能で保存する（無ければ通常のダウンロード）
    let downloads = null;
    try { if (window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads'); } catch (e) {}
    if (downloads) {
      try { await downloads.save({ filename: filename, data: json }); toast('書き出しました'); }
      catch (e) { if (!e || e.code !== 'declined') alert('書き出しできませんでした'); }
      return;
    }
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#btnImport').addEventListener('click', () => { closeMenu(); importFile.value = ''; importFile.click(); });
  importFile.addEventListener('change', () => {
    const f = importFile.files && importFile.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const raw = JSON.parse(r.result);
        const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.projects)) ? raw.projects : (raw && Array.isArray(raw.items)) ? [raw] : null;
        if (!list) throw new Error('bad shape');
        const existing = new Set();
        state.projects.forEach(p => { existing.add(p.id); p.items.forEach(it => existing.add(it.id)); });
        const imported = normalizeProjects(list, existing);
        if (!imported.length) throw new Error('empty');
        imported.forEach(p => { p.createdAt = Date.now(); p.synced = false; });
        state.projects = state.projects.concat(imported);
        state.activeProjectId = imported[0].id; activeId = null;
        render(); saveNow();
        imported.forEach(p => markDirty(p.id));
        toast(imported.length + ' 件のプロジェクトを読み込みました');
      } catch (e) {
        alert('読み込みに失敗しました。書き出した JSON ファイルを選んでください。');
      }
      importFile.value = '';
    };
    r.readAsText(f);
  });
  $('#btnCopy').addEventListener('click', () => {
    closeMenu();
    const text = toPlainText(items());
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      if (ok) toast('コピーしました'); else alert('コピーできませんでした');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('コピーしました'), fallback);
    } else fallback();
  });

  /* ========== K. toolbar & visualViewport ========== */
  toolbar.addEventListener('mousedown', (e) => e.preventDefault());
  toolbar.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  toolbar.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button[data-cmd]'); if (!b || b.disabled) return;
    e.preventDefault();
    runToolbar(b.dataset.cmd);
  });
  function runToolbar(name){
    let id = activeId && idxOf(activeId) >= 0 ? activeId : null;
    if (!id) {
      const vis = visibleIndices(items());
      id = vis.length ? items()[vis[vis.length - 1]].id : null;
    }
    const caret = currentCaret();
    switch (name) {
      case 'indent': if (id) cmd.indent(id, caret); break;
      case 'outdent': if (id) cmd.outdent(id, caret); break;
      case 'moveUp': if (id) cmd.moveUp(id, caret); break;
      case 'moveDown': if (id) cmd.moveDown(id, caret); break;
      case 'toggle': if (id) cmd.toggle(id); break;
      case 'add': cmd.addBelow(activeId && idxOf(activeId) >= 0 ? activeId : null); break;
      case 'delete': if (id) cmd.deleteItem(id); break;
    }
  }
  function placeToolbar(){
    const vv = window.visualViewport; if (!vv) return;
    const bottom = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
    toolbar.style.bottom = bottom + 'px';
    toastEl.style.bottom = 'calc(var(--toolbar-h) + 24px + ' + bottom + 'px)';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', placeToolbar);
    window.visualViewport.addEventListener('scroll', placeToolbar);
  }
  if (!supportsFieldSizing) {
    window.addEventListener('resize', debounce(() => { listEl.querySelectorAll('textarea').forEach(autosize); }, 150));
  }

  /* ========== M. sync (claude.ai Artifact の共有 db) ========== */
  // 同じ Artifact リンクを開いた端末同士で projects/<id> ドキュメントを共有する。
  // window.claude が無い環境（GitHub Pages・ローカル）では localStorage のみで動く。
  const clientId = uid();
  let db = null;
  let syncState = 'local';       // 'local' | 'syncing' | 'synced' | 'error'
  let unsubscribe = null;
  let firstSnapshot = true;
  let pendingSnap = null;
  let syncErrorShown = false;
  let dirtySeq = 0;
  const dirty = new Map();       // projectId -> seq（未送信のローカル変更）
  const pushTimers = new Map();  // projectId -> timeout id

  function touch(projectId){ saveNow(); markDirty(projectId); }

  function markDirty(id){
    if (!db || !id) return;
    dirty.set(id, ++dirtySeq);
    clearTimeout(pushTimers.get(id));
    pushTimers.set(id, setTimeout(() => pushProject(id, false), 500));
    setSyncState('syncing');
  }
  function projectDocBody(p){
    return JSON.parse(JSON.stringify({
      name: p.name, items: p.items, createdAt: p.createdAt || Date.now(), updatedAt: Date.now(), clientId: clientId
    }));
  }
  async function pushProject(id, retried){
    clearTimeout(pushTimers.get(id)); pushTimers.delete(id);
    if (!db) return;
    const p = state.projects.find(q => q.id === id);
    if (!p) { dirty.delete(id); return; }
    const seq = dirty.get(id);
    try {
      await db.doc('projects/' + id).set(projectDocBody(p));
      if (!p.synced) { p.synced = true; saveNow(); }
      if (dirty.get(id) === seq) dirty.delete(id);
      if (!dirty.size && !pushTimers.size && syncState !== 'local') setSyncState('synced');
    } catch (e) {
      if (e && e.code === 'unavailable' && !retried) {
        setTimeout(() => pushProject(id, true), 800 + Math.random() * 700);
        return;
      }
      syncFailed(e);
    }
  }
  async function deleteRemote(id){
    if (!db) return;
    dirty.delete(id); clearTimeout(pushTimers.get(id)); pushTimers.delete(id);
    try { await db.doc('projects/' + id).delete(); } catch (e) { syncFailed(e); }
  }
  function flushPushes(){ Array.from(pushTimers.keys()).forEach(id => pushProject(id, false)); }

  function applySnapshot(snap){
    if (!db) return;
    if ($('#projectList .prename')) { pendingSnap = snap; return; }   // 名前変更中は後で反映
    pendingSnap = null;
    if (firstSnapshot) {
      firstSnapshot = false;
      if (snap.empty) {                                   // 初回: ローカルのデータをアップロード
        state.projects.forEach(p => markDirty(p.id));
        return;
      }
    }
    const removed = new Set(snap.docChanges().filter(c => c.type === 'removed').map(c => c.doc.id));
    const localById = new Map(state.projects.map(p => [p.id, p]));
    const next = [];
    const seen = new Set();
    snap.docs.forEach(d => {
      if (!d.exists) return;
      const data = d.data() || {};
      seen.add(d.id);
      const lp = localById.get(d.id);
      if (lp && (dirty.has(d.id) || pushTimers.has(d.id) || data.clientId === clientId)) { next.push(lp); return; }
      const norm = normalizeProjects([{
        id: d.id, name: data.name, items: JSON.parse(JSON.stringify(data.items || [])), createdAt: data.createdAt, synced: true
      }])[0];
      norm.id = d.id;
      next.push(norm);
    });
    state.projects.forEach(p => {
      if (seen.has(p.id)) return;
      if (dirty.has(p.id) || pushTimers.has(p.id)) { next.push(p); return; }
      if (p.synced || removed.has(p.id)) return;          // 他の端末で削除された
      next.push(p); markDirty(p.id);                      // まだ送っていないローカルのプロジェクト
    });
    next.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (!next.length) { const p = newProject('新しいプロジェクト'); next.push(p); markDirty(p.id); }
    state.projects = next;
    if (!state.projects.some(p => p.id === state.activeProjectId)) { state.activeProjectId = state.projects[0].id; activeId = null; }
    render(); saveNow();
    if (!dirty.size && !pushTimers.size) setSyncState('synced');
  }
  function syncFailed(e){
    const code = e && e.code;
    if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') { goLocal(); return; }
    setSyncState('error');
    if (!syncErrorShown) { syncErrorShown = true; toast('同期できませんでした'); }
  }
  function goLocal(){
    if (unsubscribe) { try { unsubscribe(); } catch (e) {} unsubscribe = null; }
    db = null; dirty.clear();
    pushTimers.forEach(t => clearTimeout(t)); pushTimers.clear();
    setSyncState('local');
  }
  function setSyncState(s){ syncState = s; renderSyncState(); }
  function renderSyncState(){
    const dot = $('#syncDot'), note = $('#syncNote');
    const text = {
      local: 'データはこの端末のブラウザに保存されます。',
      syncing: '同期中… 同じリンクを開いた端末で共有されます。',
      synced: '同期: オン。同じリンクを開いた端末で共有されます。',
      error: '同期できませんでした。この端末には保存されています。'
    }[syncState];
    note.textContent = text;
    dot.hidden = syncState === 'local';
    dot.dataset.sync = syncState;
    dot.title = text;
  }
  async function initSync(){
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    let d = null;
    try { d = await window.claude.use('db'); } catch (e) { d = null; }
    if (!d) return;
    db = d;
    setSyncState('syncing');
    unsubscribe = db.collection('projects').onSnapshot(applySnapshot, (e) => {
      syncFailed(e);
      goLocal();
      toast('同期を停止しました。再読み込みで再接続します');
    });
  }

  /* ========== L. init ========== */
  window.addEventListener('pagehide', () => { saveSoon.flush(); flushPushes(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveSoon.flush(); flushPushes(); } });
  window.addEventListener('beforeunload', () => { saveSoon.flush(); flushPushes(); });

  render();
  renderSyncState();
  placeToolbar();
  initSync();

  if (location.hash === '#test') {
    window.__outliner = {
      getItems: () => JSON.parse(JSON.stringify(items())),
      getState: () => JSON.parse(JSON.stringify(state)),
      checkInvariants: () => {
        const its = items();
        for (let i = 0; i < its.length; i++) {
          const d = its[i].depth;
          if (d < 0 || d > MAX_DEPTH) throw new Error('depth out of range at ' + i);
          if (i === 0 ? d !== 0 : d > its[i - 1].depth + 1) throw new Error('depth jump at ' + i);
        }
        return true;
      },
      reset: () => { state = DEFAULT_STATE(); activeId = null; render(); saveNow(); state.projects.forEach(p => markDirty(p.id)); },
      syncState: () => syncState,
      isDirty: () => dirty.size > 0 || pushTimers.size > 0
    };
  }
})();
</script>
</body>
</html>
